name: Betclic Bot 24/7

on:
  schedule:
    - cron: '0 * * * *'  # Uruchamia się automatycznie co godzinę
  workflow_dispatch:      # Pozwala też na ręczne uruchomienie w każdej chwili z poziomu strony

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: |
          pip install -r requirements.txt

      - name: Uruchomienie bota
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python bot.py
